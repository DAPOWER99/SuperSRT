# ============================================
# Redis Configuration for SuperSRT
# ============================================

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Performance
tcp-backlog 511
timeout 300
tcp-keepalive 300

# Security
# requirepass ${REDIS_PASSWORD}

# Logging
loglevel notice
logfile /dev/stdout

# Database
databases 16
